# Models Unlight can download on request. Weights are never in git or the Nix store, and each
# file is checked against `sha256` before it is loaded. Add a model only after reading its
# weights' licence: see MODELS.md for what was checked and why these were chosen.

[[model]]
name = "u2net"
title = "U²-Net"
task = "subject"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx"
size = 175997641
sha256 = "8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491"
licence = "Apache-2.0"
licence_url = "https://github.com/xuebinqin/U-2-Net/blob/master/LICENSE"

[model.network]
kind = "segmentation"
input_size = 320
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]
output = "probability"

