[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
unlight-ai = { path = "crates/unlight-ai" }
unlight-catalog = { path = "crates/unlight-catalog" }
unlight-color = { path = "crates/unlight-color" }
unlight-engine = { path = "crates/unlight-engine" }
unlight-lens = { path = "crates/unlight-lens" }
unlight-lensfun-sys = { path = "crates/unlight-lensfun-sys" }
unlight-merge = { path = "crates/unlight-merge" }
unlight-output = { path = "crates/unlight-output" }
unlight-raw = { path = "crates/unlight-raw" }
unlight-raw-sys = { path = "crates/unlight-raw-sys" }
unlight-recipe = { path = "crates/unlight-recipe" }

ab_glyph = "0.2"
anyhow = "1"
bindgen = "0.72"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
epaint_default_fonts = "0.37"
fast_image_resize = "6"
flate2 = "1"
jpeg-encoder = "0.7"
jxl-oxide = "0.12"
kamadak-exif = "0.6"
lcms2 = "6"
mozjpeg = "0.10"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
pkg-config = "0.3"
png = "0.18"
pollster = "0.4"
quick-xml = "0.42"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiff = "0.10"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
walkdir = "2"
wgpu = "30"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
